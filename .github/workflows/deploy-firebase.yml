name: Deploy Analytics Dashboard to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "config.js"
      - "firebase.json"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch:

permissions:
  contents: read

# Firebase Hosting releases are atomic, but two overlapping runs still race:
# if the OLDER commit's deploy finishes LAST it becomes the live release, and
# the site serves older code than what's on main. Same reasoning as
# deploy-backend.yml in the alleasystent repo — cancel the in-flight run so
# only the newest commit ever reaches `firebase deploy`.
concurrency:
  group: firebase-hosting-analytics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    environment:
      name: firebase-hosting
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Inject the alleasystent backend URL and the Google OAuth Client ID
      # used for Sign In With Google. Set both as GitHub Actions repo
      # variables (repo → Settings → Secrets and variables → Actions →
      # Variables). Neither value is secret — the Client ID is meant to be
      # public, and the backend URL is just a Cloud Run hostname — but they
      # must match the alleasystent backend's ANALYTICS_GOOGLE_CLIENT_ID and
      # deployment respectively, and ANALYTICS_FRONTEND_URL on that backend
      # must be set to this site's origin for CORS to allow it. Moving from
      # GitHub Pages to Firebase Hosting CHANGES that origin — see
      # deployment/firebase/README.md.
      - name: Assemble site
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          CHAT_URL: ${{ vars.CHAT_URL }}
        run: |
          mkdir -p dist
          cp index.html dist/
          {
            echo "window.__BACKEND_URL__ = '${BACKEND_URL}';"
            echo "window.__GOOGLE_CLIENT_ID__ = '${GOOGLE_CLIENT_ID}';"
            echo "window.__CHAT_URL__ = '${CHAT_URL}';"
          } > dist/config.js

      # Same credentials as the alleasystent Cloud Run deploys: Firebase
      # Hosting is just another API on the same GCP project, so the existing
      # GCP_SA_KEY / GCP_PROJECT_ID pair is reused. The service account needs
      # two extra roles (Firebase Hosting Admin + Service Usage Consumer) —
      # deployment/firebase/setup_firebase.sh grants them.
      #
      # This step exports GOOGLE_APPLICATION_CREDENTIALS, which firebase-tools
      # picks up on its own — no FIREBASE_TOKEN (deprecated) needed.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # FIREBASE_SITE is the Hosting site ID inside the project (repo variable),
      # e.g. `alleasystent-analytics` → https://alleasystent-analytics.web.app.
      # The target is applied on the fly so no project ID has to be committed
      # to .firebaserc — it stays in the GCP_PROJECT_ID repo variable, exactly
      # like the Cloud Run workflows.
      - name: Deploy to Firebase Hosting
        id: deploy
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          FIREBASE_SITE: ${{ vars.FIREBASE_SITE }}
        run: |
          set -euo pipefail
          : "${PROJECT_ID:?set the GCP_PROJECT_ID repo variable}"
          : "${FIREBASE_SITE:?set the FIREBASE_SITE repo variable}"
          npx --yes firebase-tools@14 target:apply hosting analytics "$FIREBASE_SITE" \
            --project "$PROJECT_ID"
          npx --yes firebase-tools@14 deploy --only hosting:analytics \
            --project "$PROJECT_ID" \
            --non-interactive \
            --message "${GITHUB_SHA}"
          echo "url=https://${FIREBASE_SITE}.web.app" >> "$GITHUB_OUTPUT"
