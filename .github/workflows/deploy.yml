name: Deploy Analytics Dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["index.html", "config.js", ".nojekyll", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Inject the alleasystent backend URL and the Google OAuth Client ID
      # used for Sign In With Google. Set both as GitHub Actions repo
      # variables (repo → Settings → Secrets and variables → Actions →
      # Variables). Neither value is secret — the Client ID is meant to be
      # public, and the backend URL is just a Cloud Run hostname — but they
      # must match the alleasystent backend's ANALYTICS_GOOGLE_CLIENT_ID and
      # deployment respectively, and ANALYTICS_FRONTEND_URL on that backend
      # must be set to this site's origin for CORS to allow it.
      - name: Assemble site
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          CHAT_URL: ${{ vars.CHAT_URL }}
        run: |
          mkdir -p dist
          cp index.html .nojekyll dist/
          echo "window.__BACKEND_URL__ = '${BACKEND_URL}';" > dist/config.js
          echo "window.__GOOGLE_CLIENT_ID__ = '${GOOGLE_CLIENT_ID}';" >> dist/config.js
          echo "window.__CHAT_URL__ = '${CHAT_URL}';" >> dist/config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
